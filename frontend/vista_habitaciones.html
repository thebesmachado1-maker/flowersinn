<!--
  Reemplaza en tu vista:
  1) <section id="Formulario"> ... </section>
  2) el modal #modalHabitacion
  3) el modal #modalEstado
  4) los 3 <script> de habitaciones (cargarHabitaciones, abrirModal/cerrarModal, abrirModalEstado/actualizarEstado/cerrarModalEstado)
  por todo este bloque.
-->

<section id="Formulario" class="py-20 bg-sand-100">
    <div class="max-w-7xl mx-auto px-4">

        <div class="text-center mb-10">
            <h2 class="font-serif text-4xl text-emeraldCustom-900">Estado de habitaciones</h2>
            <div class="w-16 h-0.5 bg-brand-500 mx-auto mt-4 mb-6"></div>
            <button type="button" onclick="abrirModal()"
                class="inline-flex items-center gap-2 bg-emeraldCustom-900 hover:bg-emeraldCustom-800 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emeraldCustom-800">
                <i class="fa-solid fa-plus text-xs"></i> Agregar habitación
            </button>
        </div>

        <div id="contenedorHabitaciones" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5"></div>
    </div>
</section>

<!-- Modal: nueva habitación -->
<div id="modalHabitacion" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50 p-4">
    <div class="bg-white rounded-xl p-8 w-full max-w-lg shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-serif text-2xl text-emeraldCustom-900">Nueva habitación</h3>
            <button type="button" onclick="cerrarModal()" aria-label="Cerrar"
                class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
        </div>

        <form id="formHabitacion" class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
                <label class="block text-sm text-gray-600">Número
                    <input type="text" id="numero" required
                        class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-emeraldCustom-800">
                </label>
                <label class="block text-sm text-gray-600">Tipo
                    <select id="tipo" required
                        class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-white focus:outline-none focus:border-emeraldCustom-800">
                        <option value="" disabled selected>Selecciona un tipo</option>
                        <option value="Habitación Sencilla">Habitación Sencilla</option>
                        <option value="Habitación Doble">Habitación Doble</option>
                        <option value="Habitación Triple">Habitación Triple</option>
                    </select>
                </label>
                <label class="block text-sm text-gray-600">Precio por noche (USD)
                    <input type="number" id="precio" min="0" step="0.01" required
                        class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-emeraldCustom-800">
                </label>
                <label class="block text-sm text-gray-600">Estado
                    <select id="estado"
                        class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-white focus:outline-none focus:border-emeraldCustom-800">
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="OCUPADA">Ocupada</option>
                        <option value="MANTENIMIENTO">Mantenimiento</option>
                    </select>
                </label>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="cerrarModal()"
                    class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
                <button type="submit"
                    class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-emeraldCustom-900 hover:bg-emeraldCustom-800 text-white">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_HABITACIONES = 'http://localhost:5000/api/habitaciones';

    // Tarifa por noche de cada tipo (la misma de la sección de tarifas)
    const TARIFAS_NOCHE = {
        'Habitación Sencilla': 15,
        'Habitación Doble': 25,
        'Habitación Triple': 30
    };

    document.getElementById('tipo').addEventListener('change', (e) => {
        document.getElementById('precio').value = TARIFAS_NOCHE[e.target.value].toFixed(2);
    });

    const ESTADOS = {
        DISPONIBLE:    { texto: 'Disponible',    badge: 'bg-emerald-50 text-emerald-800 border-emerald-200', punto: 'bg-emerald-600' },
        OCUPADA:       { texto: 'Ocupada',       badge: 'bg-red-50 text-red-800 border-red-200',             punto: 'bg-red-700' },
        MANTENIMIENTO: { texto: 'Mantenimiento', badge: 'bg-amber-50 text-amber-800 border-amber-200',       punto: 'bg-amber-600' }
    };

    const escapar = (valor) => String(valor ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const modal = document.getElementById('modalHabitacion');

    function abrirModal() {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function cerrarModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function tarjetaHabitacion(h) {
        const estado = ESTADOS[h.estado_actual] || ESTADOS.DISPONIBLE;
        const opciones = Object.entries(ESTADOS).map(([valor, e]) =>
            `<option value="${valor}" ${valor === h.estado_actual ? 'selected' : ''}>${e.texto}</option>`
        ).join('');

        return `
        <article class="bg-white rounded-xl border border-sand-200 shadow-sm p-5 flex flex-col text-center">
            <div class="flex justify-end -mt-1 -mr-1">
                <button type="button" onclick="eliminarHabitacion(${h.id})" aria-label="Eliminar habitación ${escapar(h.numero)}"
                    class="text-gray-300 hover:text-red-700 transition p-1">
                    <i class="fa-regular fa-trash-can text-sm"></i>
                </button>
            </div>

            <h4 class="font-serif text-2xl text-emeraldCustom-900">Hab. ${escapar(h.numero)}</h4>
            <p class="text-sm text-gray-500 mt-1">${escapar(h.tipo)}</p>
            <p class="text-lg font-semibold text-brand-600 mt-3">$${Number(h.precio_referencia).toFixed(2)}</p>

            <span class="inline-flex items-center justify-center gap-2 self-center mt-4 px-3 py-1 rounded-full border text-xs font-semibold ${estado.badge}">
                <span class="w-1.5 h-1.5 rounded-full ${estado.punto}"></span>${estado.texto}
            </span>

            <select onchange="cambiarEstado(${h.id}, this.value)" aria-label="Cambiar estado de la habitación ${escapar(h.numero)}"
                class="mt-4 w-full text-xs border border-gray-200 rounded-lg p-2 bg-white text-gray-600 focus:outline-none focus:border-emeraldCustom-800">
                ${opciones}
            </select>
        </article>`;
    }

    async function cargarHabitaciones() {
        const contenedor = document.getElementById('contenedorHabitaciones');
        try {
            const respuesta = await fetch(API_HABITACIONES);
            if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
            const habitaciones = await respuesta.json();

            contenedor.innerHTML = habitaciones.length
                ? habitaciones.map(tarjetaHabitacion).join('')
                : '<p class="col-span-full text-center text-gray-500">Aún no hay habitaciones registradas.</p>';
        } catch (error) {
            console.error('Error cargando habitaciones:', error);
            contenedor.innerHTML = '<p class="col-span-full text-center text-red-700">No se pudieron cargar las habitaciones. Verifica que el servidor esté activo.</p>';
        }
    }

    async function cambiarEstado(id, estado_actual) {
        try {
            const respuesta = await fetch(`${API_HABITACIONES}/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado_actual })
            });
            if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
        } catch (error) {
            console.error('Error actualizando estado:', error);
            alert('No se pudo actualizar el estado.');
        }
        cargarHabitaciones();
    }

    async function eliminarHabitacion(id) {
        if (!confirm('¿Eliminar esta habitación? Esta acción no se puede deshacer.')) return;
        try {
            const respuesta = await fetch(`${API_HABITACIONES}/${id}`, { method: 'DELETE' });
            if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
        } catch (error) {
            console.error('Error eliminando habitación:', error);
            alert('No se pudo eliminar la habitación.');
        }
        cargarHabitaciones();
    }

    document.getElementById('formHabitacion').addEventListener('submit', async (e) => {
        e.preventDefault();

        const datos = {
            numero: document.getElementById('numero').value.trim(),
            tipo: document.getElementById('tipo').value.trim(),
            precio_referencia: document.getElementById('precio').value,
            estado_actual: document.getElementById('estado').value
        };

        try {
            const respuesta = await fetch(API_HABITACIONES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
            e.target.reset();
            cerrarModal();
        } catch (error) {
            console.error('Error guardando habitación:', error);
            alert('No se pudo guardar la habitación.');
        }
        cargarHabitaciones();
    });

    cargarHabitaciones();
</script>
